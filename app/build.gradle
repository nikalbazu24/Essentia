plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "io.github.nikalbazu24.essentia"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "0.0.3"
        archivesBaseName = "essentia-$versionName"
        ndk {
            debugSymbolLevel 'FULL'
            // AYN Thor y equipos actuales: solo 64 bits
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}