# Compila Essentia (APK para Android de 64 bits) en cada cambio.
# El APK queda en la pestaña "Releases" del repositorio (versión "dev"),
# listo para descargar directo desde la consola.

name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Si llega un cambio nuevo, se cancela la compilación anterior para que
# nunca se publique un APK viejo encima de uno nuevo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a
  HOST: aarch64-linux-android
  TARGET: aarch64-linux-android
  API: 21

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Ruby del sistema (necesario para compilar el Ruby de Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison gperf pkg-config wget

      - name: Instalar Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # OpenSSL busca el compilador de Android en el PATH
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Guarda las librerías ya compiladas para que las próximas veces sea mucho más rápido.
      - name: Recuperar librerías compiladas antes
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libiconv
            app/jni/libogg
            app/jni/libtheora
            app/jni/libvorbis
            app/jni/openal
            app/jni/openssl
            app/jni/physfs
            app/jni/pixman
            app/jni/ruby
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_sound
            app/jni/SDL2_ttf
            app/jni/uchardet
          key: deps-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/get_deps.sh', 'app/jni/Makefile') }}

      - name: Descargar dependencias
        working-directory: app/jni
        run: ./get_deps.sh

      - name: Compilar dependencias nativas (iconv, OpenAL, OpenSSL, Ruby)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          # Las variables van por entorno (no en la línea de make) para que
          # no pisen las variables internas de Ruby al compilar sus extensiones.
          ARCH=linux-x86_64 make -j"$(nproc)"

      - name: Incrustar ícono, fuentes y shaders en el motor
        working-directory: app/jni/mkxp-z
        run: |
          command -v xxd || sudo apt-get install -y xxd
          sh ./make_xxd.sh

      - name: Compilar el APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Dar al APK un nombre fijo
        run: cp app/build/outputs/apk/debug/*.apk essentia.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: essentia-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar en Releases (versión dev)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Essentia (versión de desarrollo)
          prerelease: true
          make_latest: false
          body: |
            Compilación automática del último cambio (${{ github.sha }}).
            Descarga essentia.apk e instálalo en tu equipo Android de 64 bits.
          files: essentia.apk
