# Compila Essentia (APK para Android de 64 bits) en cada cambio.
# El APK queda en la pestaña "Releases" del repositorio (versión "dev"),
# listo para descargar directo desde la consola.

name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Si llega un cambio nuevo, se cancela la compilación anterior para que
# nunca se publique un APK viejo encima de uno nuevo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ESSENTIA_BUILD_NUMBER: ${{ github.run_number }}
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a
  HOST: aarch64-linux-android
  TARGET: aarch64-linux-android
  API: 21

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Validar catálogo y copia sin conexión
        run: |
          python3 tools/check_catalog.py
          node --test tools/backend.test.cjs

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Ruby del sistema (necesario para compilar el Ruby de Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison gperf pkg-config wget

      - name: Instalar Android NDK
        timeout-minutes: 12
        run: |
          ndk_compiler="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          for attempt in 1 2; do
            if [ -x "$ndk_compiler" ]; then break; fi
            echo "Preparando Android NDK (intento $attempt de 2)"
            if yes | timeout 300 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"; then break; fi
          done
          test -x "$ndk_compiler"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # OpenSSL busca el compilador de Android en el PATH
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Compilar lector RAR para Android y pruebas
        run: |
          cmake -S app/archive-native -B work/archive-android -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release
          cmake --build work/archive-android --target essentia-archive -j2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp work/archive-android/libessentia-archive.so app/src/main/jniLibs/arm64-v8a/
          cmake -S app/archive-native -B work/archive-host -DCMAKE_BUILD_TYPE=Release
          cmake --build work/archive-host --target essentia-archive -j2
          python3 tools/prepare_archive_fixtures.py

      # Guarda las librerías ya compiladas para que las próximas veces sea mucho más rápido.
      - name: Recuperar librerías compiladas antes
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libiconv
            app/jni/libogg
            app/jni/libtheora
            app/jni/libvorbis
            app/jni/openal
            app/jni/openssl
            app/jni/physfs
            app/jni/pixman
            app/jni/ruby
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_sound
            app/jni/SDL2_ttf
            app/jni/uchardet
          key: deps-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/get_deps.sh', 'app/jni/Makefile') }}

      - name: Descargar dependencias
        working-directory: app/jni
        run: ./get_deps.sh

      - name: Compilar dependencias nativas (iconv, OpenAL, OpenSSL, Ruby)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          # Las variables van por entorno (no en la línea de make) para que
          # no pisen las variables internas de Ruby al compilar sus extensiones.
          ARCH=linux-x86_64 make -j"$(nproc)"

      - name: Incrustar ícono, fuentes y shaders en el motor
        working-directory: app/jni/mkxp-z
        run: |
          command -v xxd || sudo apt-get install -y xxd
          sh ./make_xxd.sh

      # Motor clásico (Ruby 1.8.7, el Ruby de RPG Maker XP) para juegos muy antiguos.
      # Ambos motores son obligatorios: un fallo detiene la entrega.
      - name: Recuperar Ruby 1.8 compilado antes
        id: ruby18-cache
        uses: actions/cache@v4
        with:
          path: app/jni/ruby18-out
          key: ruby18-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/build_ruby18.sh') }}

      - name: Compilar Ruby 1.8 (motor clásico)
        if: steps.ruby18-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: ./build_ruby18.sh

      - name: Preparar la firma de Essentia
        env:
          KS_B64: ${{ secrets.ESSENTIA_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ESSENTIA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/essentia.jks"
            echo "ESSENTIA_KEYSTORE_FILE=$RUNNER_TEMP/essentia.jks" >> "$GITHUB_ENV"
            echo "ESSENTIA_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "ESSENTIA_SIGNED=true" >> "$GITHUB_ENV"
            echo "Firma fija: sí"
          else
            echo "ESSENTIA_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Sin los secretos ESSENTIA_KEYSTORE_*: el APK usa una firma de prueba y no se podrá actualizar encima."
          fi

      - name: Probar archivos, restauración y compatibilidad de scripts
        run: |
          find app/src/main/assets/essentia_preload -name '*.rb' -exec ruby -c {} \;
          ruby tools/test_live_progress.rb
          ruby tools/test_translation.rb
          ruby tools/test_companion_actions.rb
          ruby tools/test_help_backup.rb
          ruby tools/test_load_network.rb
          ruby tools/test_diagnostics.rb
          ./gradlew --no-daemon testReleaseUnitTest -x externalNativeBuildRelease

      - name: Compilar el APK (versión optimizada)
        run: |
          python3 tools/prepare_licenses.py
          if ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            tail -5 "$RUNNER_TEMP/gradle.log"
            if [ -d app/jni/ruby18-out ]; then echo "Motor clásico (Ruby 1.8): incluido."; fi
          else
            grep -n -E "error:|undefined reference|undefined symbol|FAILED|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" | head -120 || true
            tail -40 "$RUNNER_TEMP/gradle.log"
            exit 1
          fi

      - name: Dejar Ruby 1.8 listo para la próxima vez
        if: always()
        working-directory: app/jni
        run: |
          if [ -d ruby18-out.failed ] && [ ! -d ruby18-out ]; then mv ruby18-out.failed ruby18-out; fi

      - name: Preparar archivos para publicar
        run: |
          cp app/build/outputs/apk/release/*.apk essentia.apk
          python3 tools/release_manifest.py app/build/outputs/apk/release/output-metadata.json version.json
          cat version.json
          python3 tools/verify_apk.py essentia.apk version.json
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$ESSENTIA_SIGNED" != "true" ]; then
            echo "::error::La distribución requiere la firma fija de Essentia."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose essentia.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: essentia-apk
          path: |
            essentia.apk
            version.json

      - name: Publicar en Releases (versión dev)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Essentia (versión de desarrollo)
          prerelease: true
          make_latest: false
          body: |
            Compilación automática del último cambio (${{ github.sha }}).
            Descarga essentia.apk e instálalo en tu equipo Android de 64 bits.
            Desde la versión 0.1 Essentia avisa sola cuando hay una versión nueva.
          files: |
            essentia.apk
            version.json
