# Compila Essentia (APK para Android de 64 bits) en cada cambio.
# El APK queda en la pestaña "Releases" del repositorio (versión "dev"),
# listo para descargar directo desde la consola.

name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Si llega un cambio nuevo, se cancela la compilación anterior para que
# nunca se publique un APK viejo encima de uno nuevo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ESSENTIA_BUILD_NUMBER: ${{ github.run_number }}
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a
  HOST: aarch64-linux-android
  TARGET: aarch64-linux-android
  API: 21

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Ruby del sistema (necesario para compilar el Ruby de Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison gperf pkg-config wget

      - name: Instalar Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # OpenSSL busca el compilador de Android en el PATH
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Guarda las librerías ya compiladas para que las próximas veces sea mucho más rápido.
      - name: Recuperar librerías compiladas antes
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libiconv
            app/jni/libogg
            app/jni/libtheora
            app/jni/libvorbis
            app/jni/openal
            app/jni/openssl
            app/jni/physfs
            app/jni/pixman
            app/jni/ruby
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_sound
            app/jni/SDL2_ttf
            app/jni/uchardet
          key: deps-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/get_deps.sh', 'app/jni/Makefile') }}

      - name: Descargar dependencias
        working-directory: app/jni
        run: ./get_deps.sh

      - name: Compilar dependencias nativas (iconv, OpenAL, OpenSSL, Ruby)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          # Las variables van por entorno (no en la línea de make) para que
          # no pisen las variables internas de Ruby al compilar sus extensiones.
          ARCH=linux-x86_64 make -j"$(nproc)"

      - name: Incrustar ícono, fuentes y shaders en el motor
        working-directory: app/jni/mkxp-z
        run: |
          command -v xxd || sudo apt-get install -y xxd
          sh ./make_xxd.sh

      # Motor clásico (Ruby 1.8.7, el Ruby de RPG Maker XP) para juegos muy antiguos.
      # Si algo falla aquí, el APK se publica igual, solo que sin el motor clásico.
      - name: Recuperar Ruby 1.8 compilado antes
        id: ruby18-cache
        uses: actions/cache@v4
        with:
          path: app/jni/ruby18-out
          key: ruby18-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/build_ruby18.sh') }}

      - name: Compilar Ruby 1.8 (motor clásico)
        if: steps.ruby18-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: app/jni
        run: ./build_ruby18.sh

      - name: Probar el motor clásico
        working-directory: app/jni
        run: |
          if [ ! -f ruby18-out/lib/libruby18.a ]; then
            echo "::warning::Sin Ruby 1.8: el APK sale sin motor clásico."
            exit 0
          fi
          if "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
               NDK_APPLICATION_MK=Application.mk APP_MODULES=mkxp-z-legacy \
               NDK_OUT="$RUNNER_TEMP/legacy-obj" NDK_LIBS_OUT="$RUNNER_TEMP/legacy-libs" \
               -j"$(nproc)" > "$RUNNER_TEMP/legacy.log" 2>&1; then
            echo "Motor clásico: compila bien."
            ls -la "$RUNNER_TEMP/legacy-libs/arm64-v8a/"
          else
            echo "::warning::El motor clásico no compiló; el APK sale sin él."
            grep -n -E "error:|undefined reference|undefined symbol" "$RUNNER_TEMP/legacy.log" | head -80 || true
            tail -30 "$RUNNER_TEMP/legacy.log"
            mv ruby18-out ruby18-out.failed
          fi

      - name: Preparar la firma de Essentia
        env:
          KS_B64: ${{ secrets.ESSENTIA_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ESSENTIA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/essentia.jks"
            echo "ESSENTIA_KEYSTORE_FILE=$RUNNER_TEMP/essentia.jks" >> "$GITHUB_ENV"
            echo "ESSENTIA_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "ESSENTIA_SIGNED=true" >> "$GITHUB_ENV"
            echo "Firma fija: sí"
          else
            echo "ESSENTIA_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Sin los secretos ESSENTIA_KEYSTORE_*: el APK usa una firma de prueba y no se podrá actualizar encima."
          fi

      - name: Compilar el APK (versión optimizada)
        run: ./gradlew --no-daemon assembleRelease

      - name: Dejar Ruby 1.8 listo para la próxima vez
        if: always()
        working-directory: app/jni
        run: |
          if [ -d ruby18-out.failed ] && [ ! -d ruby18-out ]; then mv ruby18-out.failed ruby18-out; fi

      - name: Preparar archivos para publicar
        run: |
          cp app/build/outputs/apk/release/*.apk essentia.apk
          cat > version.json <<JSON
          {
            "versionCode": $((100 + ESSENTIA_BUILD_NUMBER)),
            "versionName": "0.1.${ESSENTIA_BUILD_NUMBER}",
            "signed": ${ESSENTIA_SIGNED},
            "apk": "essentia.apk",
            "commit": "${GITHUB_SHA}"
          }
          JSON
          cat version.json

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: essentia-apk
          path: |
            essentia.apk
            version.json

      - name: Publicar en Releases (versión dev)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Essentia (versión de desarrollo)
          prerelease: true
          make_latest: false
          body: |
            Compilación automática del último cambio (${{ github.sha }}).
            Descarga essentia.apk e instálalo en tu equipo Android de 64 bits.
            Desde la versión 0.1 Essentia avisa sola cuando hay una versión nueva.
          files: |
            essentia.apk
            version.json
