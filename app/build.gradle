plugins {
    id 'com.android.application'
}

// Número de compilación (GitHub Actions lo entrega en ESSENTIA_BUILD_NUMBER).
// Cada compilación tiene un versionCode mayor, así el actualizador sabe cuál es más nueva.
def buildNumber = (System.getenv("ESSENTIA_BUILD_NUMBER") ?: "0").toInteger()

// Firma fija: el archivo y la contraseña llegan desde los secretos de GitHub.
def keystorePath = System.getenv("ESSENTIA_KEYSTORE_FILE")
def keystorePassword = System.getenv("ESSENTIA_KEYSTORE_PASSWORD")
def hasReleaseKey = keystorePath && keystorePassword && file(keystorePath).exists()

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "io.github.nikalbazu24.essentia"
        minSdk 21
        targetSdk 33
        versionCode 20000 + buildNumber
        versionName "2.0-beta.${buildNumber}"
        archivesBaseName = "essentia"
        ndk {
            // AYN Thor y equipos actuales: solo 64 bits
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        essentia {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias "essentia"
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sin la llave (p. ej. en un fork) se firma con la llave de prueba.
            signingConfig hasReleaseKey ? signingConfigs.essentia : signingConfigs.debug
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    testImplementation 'junit:junit:4.13.2'
    // The local JVM tests need the real JSON parser, not Android's stub implementation.
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    systemProperty 'java.library.path', rootProject.file('work/archive-host').absolutePath
}
